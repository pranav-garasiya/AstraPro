<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - AstraPro</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            background: #020617; /* Very dark blue/black */
        }
    </style>
</head>
<body class="auth-page">
    <a href="index.html" class="back-to-home" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);"><i class="fa-solid fa-arrow-left"></i> Back to Site</a>
    
    <div class="auth-container admin-auth">
        <!-- Form Area -->
        <div class="auth-form-area" style="flex: 1; border-radius: 24px;">
            <div class="auth-header admin-header">
                <div style="font-family: var(--font-heading); font-size: 2.5rem; font-weight: 800; color: white; margin-bottom: 20px;">Astra<span style="color: var(--secondary);">Pro</span></div>
                <h3>Admin Secure Login</h3>
                <p>Authorized personnel only.</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form-content active">
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="admin-email">Admin ID / Email</label>
                        <input type="email" id="admin-email" placeholder="admin@astrapro.com" required>
                    </div>
                    <div class="form-group">
                        <label for="admin-password">Password</label>
                        <input type="password" id="admin-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="admin-pin">2FA Security PIN</label>
                        <input type="password" id="admin-pin" placeholder="Enter 6-digit PIN" required>
                    </div>
                    <button type="submit" class="btn btn-primary auth-btn" style="background-color: var(--primary-light); color: #0f172a; margin-top: 20px;">Authenticate</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
